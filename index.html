<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Mania Food Truck by Juliana. Cardápio de Xis e pedidos pelo WhatsApp.">
<title>Mania Food Truck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Dark, quiet link page: logo, one primary action in orange, two hairline rows. Menu opens as a sheet. */
:root {
  --bg: #0A0A0A;
  --sheet: #111110;
  --fg: #F2EEE3;
  --muted: #8E887C;
  --line: rgba(242,238,227,.13);
  --orange: #F8682D;
  --ink: #0A0A0A;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { background: var(--bg); }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Roboto', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 72px 48px;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }

.glow {
  position: fixed; inset: 0 0 auto 0; height: 70vh; pointer-events: none; z-index: 0;
  background: radial-gradient(55% 60% at 50% 0%, rgba(248,104,45,.20), rgba(248,104,45,0) 70%);
}

main {
  position: relative; z-index: 1;
  width: 100%; max-width: 440px;
  display: flex; flex-direction: column; align-items: stretch;
}

.brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
.logo { width: 220px; max-width: 70%; height: auto; display: block; }
.rule { width: 36px; height: 2px; margin-top: 28px; background: var(--orange); transform-origin: center; }
.handle { margin-top: 20px; font-size: 14px; font-weight: 400; letter-spacing: .08em; color: var(--muted); }
.tagline {
  margin-top: 14px; font-size: 20px; line-height: 1.4; font-weight: 300; letter-spacing: -.01em;
  max-width: 300px;
}
.tagline .w { display: inline-block; }

.actions { margin-top: 56px; display: flex; flex-direction: column; gap: 28px; }

.primary {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; min-height: 64px; padding: 0 24px;
  border: 0; border-radius: 16px; cursor: pointer;
  background: var(--orange); color: var(--ink);
  font: inherit; font-size: 16px; font-weight: 700; letter-spacing: .01em; text-align: left;
  transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s ease;
  -webkit-tap-highlight-color: transparent;
}
.primary svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s cubic-bezier(.16,1,.3,1); }
.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -16px rgba(248,104,45,.9); }
.primary:hover svg { transform: translateX(4px); }
.primary:active { transform: translateY(0) scale(.985); }

.rows { list-style: none; border-top: 1px solid var(--line); }
.rows li { border-bottom: 1px solid var(--line); }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 64px; color: var(--fg); text-decoration: none;
  font-size: 17px; font-weight: 400;
  transition: color .25s ease, padding .35s cubic-bezier(.16,1,.3,1);
}
.row .sub { font-size: 13px; color: var(--muted); font-weight: 300; margin-left: auto; }
.row svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s cubic-bezier(.16,1,.3,1); }
.row:hover { color: var(--orange); padding-left: 6px; }
.row:hover svg { transform: translate(3px,-3px); }
.row:active { opacity: .7; }

.foot { margin-top: 56px; text-align: center; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

a:focus-visible, button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 8px; }

/* Menu sheet */
.backdrop {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none; transition: opacity .35s ease;
}
.backdrop.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; z-index: 21; left: 50%; bottom: 0;
  width: min(560px, 100%); height: min(92dvh, 880px);
  translate: -50% 105%;
  background: var(--sheet); color: var(--fg);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0;
  display: flex; flex-direction: column; visibility: hidden;
  transition: translate .55s cubic-bezier(.16,1,.3,1), visibility 0s linear .55s;
}
.sheet.open { translate: -50% 0; visibility: visible; transition: translate .55s cubic-bezier(.16,1,.3,1), visibility 0s; }

.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 24px 24px 12px; }
.sheet-head h2 { font-size: 28px; font-weight: 500; letter-spacing: -.02em; }
.sheet-head p { margin-top: 4px; font-size: 14px; color: var(--muted); font-weight: 300; }
.close {
  width: 44px; height: 44px; flex: none; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  font: inherit; font-size: 22px; line-height: 1;
  transition: transform .3s cubic-bezier(.16,1,.3,1), border-color .2s ease;
}
.close:hover { transform: rotate(90deg); border-color: var(--orange); }

.sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 24px 28px; }
.item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.item-name { font-size: 17px; font-weight: 500; }
.item-desc { margin-top: 3px; font-size: 13px; line-height: 1.45; color: var(--muted); font-weight: 300; }
.item-price { margin-top: 8px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--orange); }

.step { display: flex; align-items: center; gap: 2px; }
.step button {
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  font: inherit; font-size: 22px; line-height: 1; display: grid; place-items: center;
  transition: transform .25s cubic-bezier(.16,1,.3,1), background .2s ease, border-color .2s ease, color .2s ease;
}
.step .inc { border-color: var(--orange); color: var(--orange); }
.step .inc:hover { background: var(--orange); color: var(--ink); transform: translateY(-2px); }
.step .dec:hover { border-color: var(--fg); transform: translateY(-2px); }
.step button:active { transform: scale(.92); }
.step .qty { min-width: 28px; text-align: center; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.step .dec, .step .qty { display: none; }
.item.has .step .dec, .item.has .step .qty { display: grid; }
.item.has .item-name { color: var(--orange); }
.qty.bump { animation: bump .35s cubic-bezier(.16,1,.3,1); }
@keyframes bump { 50% { transform: scale(1.35); } }

.fields { margin-top: 28px; display: grid; gap: 14px; }
.fields label { display: grid; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.fields input, .fields textarea {
  width: 100%; font: inherit; font-size: 16px; letter-spacing: 0; text-transform: none; font-weight: 400;
  padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
  background: transparent; color: var(--fg);
}
.fields textarea { min-height: 84px; resize: vertical; }
.fields input::placeholder, .fields textarea::placeholder { color: #5c5850; }
.fields input:focus-visible, .fields textarea:focus-visible { outline: 0; border-color: var(--orange); }

.sheet-foot { padding: 16px 24px max(20px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 12px; background: var(--sheet); }
.sum { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); }
.sum strong { font-size: 24px; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.send {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; border-radius: 14px; text-decoration: none;
  background: var(--orange); color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: .01em;
  transition: transform .3s cubic-bezier(.16,1,.3,1), opacity .2s ease, box-shadow .3s ease;
}
.send svg { width: 20px; height: 20px; fill: currentColor; }
.send:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -14px rgba(248,104,45,.9); }
.send:active { transform: scale(.985); }
.send[aria-disabled="true"] { opacity: .35; pointer-events: none; }

.cartbar {
  position: fixed; z-index: 15; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 32px)); translate: -50% 160%;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 56px; padding: 0 22px; border: 0; border-radius: 16px; cursor: pointer;
  background: var(--fg); color: var(--ink); font: inherit; font-size: 15px; font-weight: 700;
  box-shadow: 0 18px 40px -14px rgba(0,0,0,.9);
  transition: translate .55s cubic-bezier(.16,1,.3,1);
}
.cartbar.show { translate: -50% 0; }
.cartbar span:last-child { font-variant-numeric: tabular-nums; }

/* Motion: off under reduced motion, everything stays visible at rest */
@media (prefers-reduced-motion: no-preference) {
  .glow { animation: breathe 9s ease-in-out infinite; }
  .logo { animation: logo-in 1.1s cubic-bezier(.16,1,.3,1) both; }
  .rule { animation: draw .9s cubic-bezier(.16,1,.3,1) .5s both; }
  .handle { animation: rise .8s cubic-bezier(.16,1,.3,1) .6s both; }
  .tagline .w { animation: word .8s cubic-bezier(.16,1,.3,1) both; }
  .actions > * { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
  .rows li { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
  .foot { animation: rise .9s cubic-bezier(.16,1,.3,1) 1.5s both; }
  .sheet.open .sheet-head, .sheet.open .item, .sheet.open .fields { animation: rise .6s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i, 0) * 40ms + 160ms); }

  @keyframes breathe { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes logo-in { from { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(8px); } }
  @keyframes draw { from { transform: scaleX(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes word { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .backdrop, .cartbar { transition-duration: .01ms !important; }
}
</style>
</head>

    <ul class="rows">
      <li style="animation-delay:1.3s">
        <a class="row" href="https://instagram.com/mania.foodtruck" target="_blank" rel="noopener">
          Instagram <span class="sub">@mania.foodtruck</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
        </a>
      </li>
      <li style="animation-delay:1.4s">
        <a class="row" href="https://wa.me/555596875593" target="_blank" rel="noopener">
          WhatsApp <span class="sub">Falar com a gente</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>
        </a>
      </li>
    </ul>
  </div>

  <p class="foot">Mania. By Juliana</p>
</main>

<div class="backdrop" id="backdrop"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="sheet-head">
    <div>
      <h2 id="sheet-title">Cardápio</h2>
      <p>Menu de Xis. Escolha e envie o pedido pelo WhatsApp.</p>
    </div>
    <button class="close" type="button" id="close-menu" aria-label="Fechar cardápio">&times;</button>
  </div>
  <div class="sheet-body" id="sheet-body">
    <div id="menu"></div>
    <div class="fields">
      <label for="cust-name">Seu nome
        <input id="cust-name" type="text" autocomplete="name" placeholder="Como podemos te chamar?">
      </label>
      <label for="cust-note">Observações
        <textarea id="cust-note" placeholder="Sem tomate, endereço de entrega, troco..."></textarea>
      </label>
    </div>
  </div>
  <div class="sheet-foot">
    <div class="sum"><span id="sum-count">Nenhum item</span><strong id="sum-total">R$ 0,00</strong></div>
    <a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Enviar pedido no WhatsApp
    </a>
  </div>
</section>

<button class="cartbar" type="button" id="cartbar" aria-label="Ver pedido">
  <span id="bar-count">0 itens</span>
  <span id="bar-total">R$ 0,00</span>
</button>

<script>
(function () {
  // Edite aqui: itens, descrições e preços. O número que recebe os pedidos é WHATSAPP.
  var WHATSAPP = '555596875593';
  var common = 'alface, tomate, milho, ervilha, catchup, mostarda e maionese';
  var MENU = [
    { cat: 'Xis', items: [
      { id: 'x1', name: 'Entreveiro', desc: 'Pão, carne de gado, frango, bacon, calabresa, cebola, pimentão, catchup, mostarda e maionese', price: 32 },
      { id: 'x2', name: 'X-Salada', desc: 'Pão, bife, ovo, queijo, ' + common, price: 30 },
      { id: 'x3', name: 'X-Calabresa', desc: 'Pão, calabresa, ovo, queijo, ' + common, price: 30 },
      { id: 'x4', name: 'X-Frango', desc: 'Pão, frango, ovo, queijo, ' + common, price: 30 },
      { id: 'x5', name: 'X-Vegetariano', desc: 'Pão, ovo, queijo, ' + common, price: 30 },
      { id: 'x6', name: 'X-Bacon', desc: 'Pão, bacon, ovo, queijo, ' + common, price: 32 },
      { id: 'x7', name: 'X-Bacon/Calabresa', desc: 'Pão, calabresa, bacon, ovo, queijo, ' + common, price: 35 },
      { id: 'x8', name: 'X-Coração', desc: 'Pão, coração de frango, ovo, queijo, ' + common, price: 38 },
      { id: 'x9', name: 'X-Strogonoff', desc: 'Pão, strogonoff, ovo, queijo, molho, alface, tomate, milho, ervilha, batata palha, catchup, mostarda e maionese', price: 38 },
      { id: 'x10', name: 'X-Strogonoff/Bacon', desc: 'Pão, strogonoff, bacon, ovo, queijo, molho, alface, tomate, milho, ervilha, batata palha, catchup, mostarda e maionese', price: 40 },
      { id: 'x11', name: 'X-Picanha', desc: 'Pão, picanha, ovo, queijo, ' + common, price: 40 },
      { id: 'x12', name: 'X-Mania', desc: 'Pão, 2 bifes, 2 ovos, 2 queijos, ' + common, price: 40 },
      { id: 'x13', name: 'X-Tudo', desc: 'Pão, bife, calabresa, bacon, coração de frango, ovo, queijo, ' + common, price: 40 }
    ]}
  ];

  var qty = {};
  var byId = {};
  var money = function (v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }).replace(/ /g, ' ');
  };
  var $ = function (id) { return document.getElementById(id); };
  var sheet = $('sheet'), backdrop = $('backdrop'), menuEl = $('menu'), send = $('send'), cartbar = $('cartbar');
  var lastFocus = null, idx = 0;

  var html = '';
  MENU.forEach(function (g) {
    g.items.forEach(function (it) {
      byId[it.id] = it; qty[it.id] = 0;
      html += '<div class="item" data-id="' + it.id + '" style="--i:' + (++idx) + '">' +
        '<div><div class="item-name">' + it.name + '</div><div class="item-desc">' + it.desc + '</div>' +
        '<div class="item-price">' + money(it.price) + '</div></div>' +
        '<div class="step">' +
          '<button type="button" class="dec" data-act="dec" aria-label="Remover ' + it.name + '">&minus;</button>' +
          '<span class="qty" aria-live="polite">0</span>' +
          '<button type="button" class="inc" data-act="inc" aria-label="Adicionar ' + it.name + '">+</button>' +
        '</div></div>';
    });
  });
  menuEl.innerHTML = html;

  function summary() {
    var count = 0, total = 0;
    Object.keys(qty).forEach(function (id) { count += qty[id]; total += qty[id] * byId[id].price; });
    return { count: count, total: total };
  }

  function message() {
    var lines = ['Olá, Mania! Quero fazer um pedido:', ''];
    var t = 0;
    Object.keys(qty).forEach(function (id) {
      if (!qty[id]) return;
      var sub = qty[id] * byId[id].price; t += sub;
      lines.push(qty[id] + 'x ' + byId[id].name + ' - ' + money(sub));
    });
    lines.push('', 'Total: ' + money(t));
    var name = $('cust-name').value.trim(), note = $('cust-note').value.trim();
    if (name) lines.push('', 'Nome: ' + name);
    if (note) lines.push('Observações: ' + note);
    return lines.join('\n');
  }

  function refresh() {
    var s = summary();
    var label = s.count === 0 ? 'Nenhum item' : s.count + (s.count === 1 ? ' item' : ' itens');
    $('sum-count').textContent = label;
    $('sum-total').textContent = money(s.total);
    $('bar-count').textContent = label;
    $('bar-total').textContent = money(s.total);
    cartbar.classList.toggle('show', s.count > 0 && !sheet.classList.contains('open'));
    if (s.count > 0) {
      send.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(message());
      send.removeAttribute('aria-disabled');
    } else {
      send.href = '#';
      send.setAttribute('aria-disabled', 'true');
    }
  }

  menuEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var row = btn.closest('.item'), id = row.getAttribute('data-id');
    qty[id] = Math.max(0, qty[id] + (btn.getAttribute('data-act') === 'inc' ? 1 : -1));
    var q = row.querySelector('.qty');
    q.textContent = qty[id];
    row.classList.toggle('has', qty[id] > 0);
    q.classList.remove('bump'); void q.offsetWidth; q.classList.add('bump');
    refresh();
  });
  $('cust-name').addEventListener('input', refresh);
  $('cust-note').addEventListener('input', refresh);
  send.addEventListener('click', function (e) { if (send.getAttribute('aria-disabled') === 'true') e.preventDefault(); });

  function open() {
    lastFocus = document.activeElement;
    sheet.classList.add('open'); backdrop.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.body.classList.add('locked');
    refresh();
    setTimeout(function () { $('close-menu').focus(); }, 60);
  }
  function close() {
    sheet.classList.remove('open'); backdrop.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('locked');
    refresh();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('open-menu').addEventListener('click', open);
  cartbar.addEventListener('click', open);
  $('close-menu').addEventListener('click', close);
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('open')) close(); });

  refresh();
})();
</script>

</body>
</html>
